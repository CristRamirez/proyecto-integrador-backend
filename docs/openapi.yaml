openapi: 3.0.3
info:
  title: Proyecto Integrador - API REST
  version: 0.2.0
  description: |
    API del sistema de gestión de internos y cobranzas.

    **Cómo probar:** primero `POST /auth/login`, copiar el `token` de la respuesta y
    cargarlo en el botón **Authorize** (sin escribir "Bearer", se agrega solo).

    Todas las respuestas traen `ok`. Los errores tienen siempre la misma forma:
    `{ "ok": false, "error": { "codigo": "...", "mensaje": "..." } }`. El front tiene que
    decidir por `codigo` (no cambia) y mostrar `mensaje` (texto para el usuario).

    Las fechas van como texto: `AAAA-MM-DD` las que carga el usuario y
    `AAAA-MM-DD HH:MM:SS` (UTC) las que pone la base.

servers:
  - url: http://localhost:3000/api
    description: Local (npm run dev)

tags:
  - name: Salud
  - name: Auth
  - name: Internos
  - name: Catálogos
  - name: Módulos
    description: ABM de módulos (solo rol administrador)
  - name: Roles
    description: Permisos de cada rol (solo rol administrador)
  - name: Parámetros
    description: Valores con los que se generan las cuotas (solo rol administrador)
  - name: Cobranzas
    description: Cuotas, pagos y egresos
  - name: Ejemplo
    description: Rutas de muestra, no son parte del sistema

security:
  - token: []

paths:
  # ------------------------------------------------------------------
  # SALUD
  # ------------------------------------------------------------------
  /salud:
    get:
      tags: [Salud]
      summary: Ver si la API está viva
      security: []
      parameters:
        - name: db
          in: query
          required: false
          description: Con `1` también prueba la conexión a la base.
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: La API responde
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  servicio: { type: string, example: proyecto-integrador-api }
                  version: { type: string, example: 0.2.0 }
                  hora: { type: string, format: date-time }
                  baseDeDatos:
                    type: object
                    description: Solo viene con `?db=1`
                    properties:
                      conectada: { type: boolean, example: true }
                      roles: { type: integer, example: 5 }

  # ------------------------------------------------------------------
  # AUTH
  # ------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión (devuelve el token)
      description: |
        A los 5 intentos fallidos seguidos el usuario queda bloqueado 5 minutos (423),
        aunque después ponga bien la contraseña.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre_usuario, password]
              properties:
                nombre_usuario: { type: string, example: admin }
                password: { type: string, example: admin1234 }
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  token: { type: string, example: eyJhbGciOi... }
                  usuario:
                    allOf:
                      - $ref: '#/components/schemas/UsuarioSesion'
                      - type: object
                        properties:
                          nombreCompleto: { type: string, nullable: true, example: Administrador de prueba }
        '400': { $ref: '#/components/responses/SolicitudInvalida' }
        '401':
          description: '`CREDENCIALES_INVALIDAS` (mismo mensaje si falla el usuario o la contraseña)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: '`USUARIO_INACTIVO`: el usuario está deshabilitado'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '`USUARIO_BLOQUEADO`: bloqueado por intentos fallidos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/yo:
    get:
      tags: [Auth]
      summary: Datos del usuario dueño del token
      description: Sirve para saber si la sesión sigue viva y qué opciones del menú mostrar.
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  usuario: { $ref: '#/components/schemas/UsuarioSesion' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ------------------------------------------------------------------
  # INTERNOS
  # ------------------------------------------------------------------
  /internos:
    get:
      tags: [Internos]
      summary: Padrón de internos (BS-3)
      description: |
        Búsqueda, filtros y paginación. Todos los parámetros son opcionales y se combinan.
        Ordenado por apellido y nombre.
      parameters:
        - name: q
          in: query
          description: |
            Busca en DNI, apellido, nombre y número de legajo, sin distinguir mayúsculas,
            acentos ni ñ. Con varias palabras, cada una tiene que aparecer en algún campo
            (se toman hasta 5).
          schema: { type: string, example: perez juan }
        - name: estado
          in: query
          schema: { type: string, enum: [activo, egresado] }
        - name: judicializado
          in: query
          schema: { type: string, enum: ['0', '1'] }
        - name: pagina
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: por_pagina
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Página del padrón
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  internos:
                    type: array
                    items: { $ref: '#/components/schemas/InternoPadron' }
                  paginacion:
                    type: object
                    properties:
                      pagina: { type: integer, example: 1 }
                      por_pagina: { type: integer, example: 20 }
                      total: { type: integer, example: 1 }
                      total_paginas: { type: integer, example: 1 }
        '400':
          description: '`ESTADO_INEXISTENTE`, `DATOS_INVALIDOS` (judicializado) o `PAGINACION_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

    post:
      tags: [Internos]
      summary: Alta de interno (BS-2)
      description: |
        Crea el interno en estado `activo`, le genera el legajo (`LEG-AAAAMMDD-NNNN`),
        guarda los contactos y deja la primera fila del historial de estados.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternoAlta' }
      responses:
        '201':
          description: Interno creado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  interno: { $ref: '#/components/schemas/InternoFicha' }
        '400':
          description: |
            `DATOS_INCOMPLETOS`, `DNI_INVALIDO`, `CONTACTOS_INSUFICIENTES`, `CONTACTO_INVALIDO`,
            `FECHA_INVALIDA`, `DATOS_INVALIDOS`, `ID_INVALIDO` u `OBRA_SOCIAL_INEXISTENTE`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409': { $ref: '#/components/responses/DniDuplicado' }

  /internos/verificar-dni/{dni}:
    get:
      tags: [Internos]
      summary: Avisar si el DNI ya es de un interno activo
      description: |
        Para avisar en la pantalla de alta apenas se escribe el DNI. Es solo un aviso:
        el alta lo vuelve a controlar al guardar.
      parameters:
        - name: dni
          in: path
          required: true
          schema: { type: string, pattern: '^\d{7,8}$', example: '30111222' }
      responses:
        '200':
          description: Resultado de la consulta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  duplicado: { type: boolean, example: true }
                  interno:
                    type: object
                    nullable: true
                    description: '`null` si no está repetido'
                    properties:
                      id: { type: integer, example: 7 }
                      dni: { type: string, example: '30111222' }
                      apellido: { type: string, example: Perez }
                      nombre: { type: string, example: Juan }
        '400':
          description: '`DNI_INVALIDO`: no es un número de 7 u 8 dígitos'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /internos/{id}:
    parameters:
      - $ref: '#/components/parameters/IdInterno'
    get:
      tags: [Internos]
      summary: Ficha completa del interno (BS-4)
      description: Datos, legajos, contactos y la línea de tiempo de estados (del más viejo al más nuevo).
      responses:
        '200':
          description: Ficha del interno
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  interno: { $ref: '#/components/schemas/InternoFichaCompleta' }
        '400': { $ref: '#/components/responses/IdInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/InternoNoEncontrado' }

    put:
      tags: [Internos]
      summary: Modificación de datos del interno (BS-5)
      description: |
        Se manda solo lo que cambia; lo que no viene queda como estaba. Los opcionales se
        borran mandándolos en `null`. Si vienen `contactos`, reemplazan a todos los anteriores.

        **No se modifican** el número de legajo ni la fecha de ingreso: si llegan con el mismo
        valor que ya tienen se ignoran (así se puede reenviar el formulario completo), si
        llegan con otro valor responde 400 `CAMPO_NO_MODIFICABLE`. El estado tampoco se
        cambia por acá.

        Al guardar se registra el usuario (`modificado_por`) y la fecha y hora (`modificado_en`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternoModificacion' }
            example:
              apellido: Pérez
              datos_salud: hipertenso, diabético
              obra_social_id: 2
              contactos:
                - { nombre: Maria Perez, parentesco: madre, telefono: '1155556666' }
                - { nombre: Ana Perez, parentesco: hermana, email: ana@mail.com }
      responses:
        '200':
          description: Interno modificado, devuelve la ficha completa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  interno: { $ref: '#/components/schemas/InternoFichaCompleta' }
        '400':
          description: |
            `ID_INVALIDO`, `SIN_CAMBIOS`, `CAMPO_NO_MODIFICABLE`, o los mismos errores de
            validación del alta (`DATOS_INCOMPLETOS`, `DNI_INVALIDO`, `CONTACTOS_INSUFICIENTES`,
            `CONTACTO_INVALIDO`, `FECHA_INVALIDA`, `DATOS_INVALIDOS`, `OBRA_SOCIAL_INEXISTENTE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/InternoNoEncontrado' }
        '409': { $ref: '#/components/responses/DniDuplicado' }

  /internos/{id}/baja:
    parameters:
      - $ref: '#/components/parameters/IdInterno'
    post:
      tags: [Internos]
      summary: Baja de interno (BS-6)
      description: |
        Baja **lógica**: el registro no se borra. El interno pasa al estado `egresado`, deja de
        aparecer al filtrar por `estado=activo` y el cambio queda asentado en su historial de
        estados con el motivo, la fecha de egreso y quién lo hizo.

        `motivo` y `fecha_egreso` son obligatorios. La fecha no puede ser futura ni anterior a
        la fecha de ingreso del interno.

        Después de la baja el DNI queda libre para una nueva alta, porque es único solo entre
        los internos activos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternoBaja' }
            example:
              motivo: Alta médica
              fecha_egreso: '2026-10-03'
      responses:
        '200':
          description: Interno dado de baja, devuelve la ficha completa
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  interno: { $ref: '#/components/schemas/InternoFichaCompleta' }
        '400':
          description: '`ID_INVALIDO`, `DATOS_INCOMPLETOS` (falta el motivo o la fecha), `MOTIVO_INVALIDO` o `FECHA_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/InternoNoEncontrado' }
        '409':
          description: '`INTERNO_YA_EGRESADO`: el interno ya estaba dado de baja'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /internos/{id}/cuenta-corriente:
    parameters:
      - $ref: '#/components/parameters/IdInterno'
    get:
      tags: [Cobranzas]
      summary: Cuenta corriente del interno (BS-9)
      description: |
        Todas las cuotas del interno, de la más vieja a la más nueva, con los pagos aplicados
        y el saldo de cada una, más el total adeudado (suma de los saldos de las cuotas que no
        están anuladas). Un interno sin cuotas devuelve la lista vacía y el total en cero.

        Pide el módulo `cobranzas` y no el de `internos`: un rol de contador puede cobrar sin
        tener acceso al padrón. Las cuotas en mora traen el interés en `interes_aplicado`, ya
        sumado al total y al saldo (BS-11).
      responses:
        '200':
          description: La cuenta corriente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  interno:
                    type: object
                    properties:
                      id: { type: integer, example: 1 }
                      dni: { type: string, example: '30111222' }
                      apellido: { type: string, example: Pérez }
                      nombre: { type: string, example: Juan }
                  cuotas:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Cuota'
                        - type: object
                          properties:
                            pagos:
                              type: array
                              items: { $ref: '#/components/schemas/Pago' }
                  total_adeudado: { type: number, format: float, example: 9000 }
        '400': { $ref: '#/components/responses/IdInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404': { $ref: '#/components/responses/InternoNoEncontrado' }

  # ------------------------------------------------------------------
  # PARÁMETROS DE COBRANZA
  # ------------------------------------------------------------------
  /parametros:
    get:
      tags: [Parámetros]
      summary: Parámetros de cobranza vigentes (BS-13)
      description: Devuelve la configuración marcada como actual, o null si todavía no se cargó ninguna.
      responses:
        '200':
          description: La configuración vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  configuracion:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/ConfiguracionCuota' }]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

    post:
      tags: [Parámetros]
      summary: Guardar parámetros de cobranza (BS-13)
      description: |
        Nunca edita la configuración vigente: crea una fila nueva marcada como actual y archiva
        la anterior, que queda en el histórico con su fecha. Rige desde que se guarda.

        Las cuotas ya generadas no se modifican de forma retroactiva: cada una guarda con qué
        configuración se emitió y copia sus valores.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParametrosNuevos' }
            example:
              valor_cuota: 18000
              valor_mora: 800
              dia_vencimiento: 15
              observaciones: Aumento de noviembre
      responses:
        '201':
          description: Configuración guardada, ya vigente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  configuracion: { $ref: '#/components/schemas/ConfiguracionCuota' }
        '400':
          description: '`DATOS_INCOMPLETOS`, `MONTO_INVALIDO`, `DIA_INVALIDO` u `OBSERVACIONES_INVALIDAS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /parametros/historico:
    get:
      tags: [Parámetros]
      summary: Histórico de parámetros de cobranza (BS-13)
      description: Todas las configuraciones, de la más nueva a la más vieja, con quién definió cada una.
      responses:
        '200':
          description: El histórico completo
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  configuraciones:
                    type: array
                    items: { $ref: '#/components/schemas/ConfiguracionCuota' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ------------------------------------------------------------------
  # COBRANZAS
  # ------------------------------------------------------------------
  /cuotas:
    get:
      tags: [Cobranzas]
      summary: Cuotas de un período, de todos los internos
      description: |
        Lo que necesita la pantalla principal de Cobranzas: el listado de cuotas del período
        con los totales de arriba.

        `estado` acepta los del catálogo y además `vencida`, que se filtra como condición:
        saldo mayor a cero, no anulada y fecha de vencimiento anterior a hoy. Incluye las que
        están en mora (estado `vencida`) y las que vencieron con un pago en término, que no
        llevan interés y siguen como `parcial`.

        El `resumen` es de todo el período y **no** aplica `estado` ni `q`: son los indicadores
        de la pantalla, que no cambian al filtrar. No cuenta las anuladas.
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 }, example: 2026 }
        - { name: mes, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 }, example: 10 }
        - name: estado
          in: query
          required: false
          schema: { type: string, enum: [pendiente, parcial, pagada, vencida, anulada] }
        - name: q
          in: query
          required: false
          description: Busca por DNI, apellido, nombre o legajo, sin distinguir mayúsculas ni acentos.
          schema: { type: string }
          example: perez
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Cuotas del período, con el resumen y la paginación
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  periodo:
                    type: object
                    properties:
                      anio: { type: integer, example: 2026 }
                      mes: { type: integer, example: 10 }
                  resumen: { $ref: '#/components/schemas/ResumenPeriodo' }
                  cuotas:
                    type: array
                    items: { $ref: '#/components/schemas/CuotaDelPeriodo' }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
        '400':
          description: '`DATOS_INCOMPLETOS`, `PERIODO_INVALIDO`, `ESTADO_INEXISTENTE` o `PAGINACION_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /cuotas/generar:
    post:
      tags: [Cobranzas]
      summary: Generación de cuotas del período (BS-7)
      description: |
        Crea una cuota por cada interno activo que todavía no tenga la del período, con el valor
        de la configuración vigente (BS-13). Si no hay parámetros cargados corta con 409.

        Es seguro correrlo dos veces: los internos que ya tienen la cuota del período se omiten.
        Los dados de baja no entran. La fecha de vencimiento sale del día configurado y se ajusta
        al último día del mes cuando no existe (día 31 en febrero vence el 28).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodoCuotas' }
            example: { anio: 2026, mes: 11 }
      responses:
        '200':
          description: Resultado de la corrida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoGeneracion' }
        '400':
          description: '`DATOS_INCOMPLETOS` o `PERIODO_INVALIDO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: '`SIN_PARAMETROS`: no hay parámetros de cobranza cargados'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /cuotas/aplicar-mora:
    post:
      tags: [Cobranzas]
      summary: Aplica el interés por mora a las cuotas vencidas (BS-11)
      description: |
        Lo mismo que hace el cron diario del Worker (03:05 UTC), para correrlo a mano.

        Entra en mora la cuota que tiene saldo, no está pagada ni anulada, ya pasó su fecha de
        vencimiento y no tiene ningún pago registrado hasta ese día inclusive (regla 6: si pagó
        algo en término no lleva interés; regla 7: si no, se aplica desde el día siguiente al
        vencimiento).

        El interés es el `valor_mora` de la configuración con la que se emitió la cuota. Se
        suma a `interes_aplicado`, al total y al saldo, y la cuota pasa a `vencida`. Es seguro
        correrlo varias veces: las que ya están vencidas no vuelven a sumar interés.
      responses:
        '200':
          description: Cuotas a las que se les aplicó el interés en esta corrida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoMora' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /cuotas/{id}/pagos:
    parameters:
      - $ref: '#/components/parameters/IdCuota'
    post:
      tags: [Cobranzas]
      summary: Registro de pago total o parcial (BS-8)
      description: |
        Aplica un pago a la cuota, descuenta el monto del saldo y recalcula el estado: si el
        saldo queda en cero pasa a `pagada`, si no a `parcial` (o sigue `vencida` si está en
        mora). No admite montos mayores al saldo pendiente. Los importes se redondean a centavos.

        La mora (BS-11) se mira por la fecha del pago: si es posterior al vencimiento y la cuota
        todavía no tenía el interés, se le aplica antes de descontar el pago; si es en término y
        la cuota ya tenía la mora, se le quita.

        Si el medio de pago es **obra social**, `obra_social_id` es obligatorio. Mientras la
        tabla de pagos no tenga columna propia, la obra social queda escrita al principio de
        las observaciones.

        Si no viene `fecha_pago` se toma la de hoy. No puede ser futura.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PagoNuevo' }
            example:
              medio_pago_id: 1
              monto: 9000
              fecha_pago: '2026-10-20'
              numero_comprobante: 0001-00012345
              observaciones: pago parcial
      responses:
        '201':
          description: Pago registrado; devuelve la cuota actualizada y sus pagos
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  cuota: { $ref: '#/components/schemas/Cuota' }
                  pagos:
                    type: array
                    items: { $ref: '#/components/schemas/Pago' }
        '400':
          description: |
            `ID_INVALIDO`, `DATOS_INCOMPLETOS`, `MONTO_INVALIDO`, `MONTO_MAYOR_AL_SALDO`,
            `MEDIO_PAGO_INEXISTENTE`, `OBRA_SOCIAL_REQUERIDA`, `OBRA_SOCIAL_INEXISTENTE`,
            `FECHA_INVALIDA`, `COMPROBANTE_INVALIDO` u `OBSERVACIONES_INVALIDAS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: '`CUOTA_NO_ENCONTRADA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`CUOTA_ANULADA` o `CUOTA_SIN_SALDO` (la cuota ya está pagada)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /egresos:
    get:
      tags: [Cobranzas]
      summary: Egresos del período (BS-12)
      description: |
        Los gastos de la institución de un período, con el total y el desglose por categoría,
        para contrastarlos con los ingresos del mes (el `cobrado` del resumen de `/cuotas`).

        El `resumen` es de todo el período y **no** aplica el filtro de categoría. Ordena del
        egreso más reciente al más viejo.
      parameters:
        - { name: anio, in: query, required: true, schema: { type: integer, minimum: 2020, maximum: 2100 }, example: 2026 }
        - { name: mes, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 }, example: 10 }
        - name: categoria
          in: query
          required: false
          description: No distingue mayúsculas.
          schema: { type: string }
          example: servicios
        - { name: pagina, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: por_pagina, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Egresos del período, con el resumen y la paginación
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  periodo:
                    type: object
                    properties:
                      anio: { type: integer, example: 2026 }
                      mes: { type: integer, example: 10 }
                  resumen: { $ref: '#/components/schemas/ResumenEgresos' }
                  egresos:
                    type: array
                    items: { $ref: '#/components/schemas/Egreso' }
                  paginacion: { $ref: '#/components/schemas/Paginacion' }
        '400':
          description: '`DATOS_INCOMPLETOS`, `PERIODO_INVALIDO` o `PAGINACION_INVALIDA`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

    post:
      tags: [Cobranzas]
      summary: Registro de un egreso institucional (BS-12)
      description: |
        La fecha es opcional: si no viene se usa la del día, y no puede ser futura. La categoría
        se guarda en minúsculas para que no se dupliquen en los totales.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EgresoNuevo' }
            example:
              concepto: Factura de luz
              categoria: servicios
              monto: 45000.5
              medio_pago_id: 2
              fecha: '2026-10-05'
              comprobante: B-0001-00099
      responses:
        '201':
          description: Egreso registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  egreso: { $ref: '#/components/schemas/Egreso' }
        '400':
          description: |
            `DATOS_INCOMPLETOS`, `MONTO_INVALIDO`, `MEDIO_PAGO_INEXISTENTE`, `FECHA_INVALIDA`,
            `CONCEPTO_INVALIDO`, `CATEGORIA_INVALIDA`, `COMPROBANTE_INVALIDO` u `OBSERVACIONES_INVALIDAS`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /egresos/categorias:
    get:
      tags: [Cobranzas]
      summary: Categorías de egresos ya usadas (BS-12)
      description: Para ofrecerlas en el formulario sin obligar a escribirlas de nuevo.
      responses:
        '200':
          description: Las categorías cargadas, ordenadas alfabéticamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  categorias:
                    type: array
                    items: { type: string }
                    example: [insumos, servicios, sueldos]
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  # ------------------------------------------------------------------
  # CATÁLOGOS
  # ------------------------------------------------------------------
  /estados:
    get:
      tags: [Catálogos]
      summary: Estados posibles del interno
      responses:
        '200':
          description: Lista ordenada por nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  estados:
                    type: array
                    items: { $ref: '#/components/schemas/ItemCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /medios-pago:
    get:
      tags: [Catálogos]
      summary: Catálogo de medios de pago
      description: Para el desplegable del pago. Los ids salen de acá, no se escriben a mano en el front.
      responses:
        '200':
          description: Los medios de pago cargados
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  mediosPago:
                    type: array
                    items: { $ref: '#/components/schemas/ItemCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  /obras-sociales:
    get:
      tags: [Catálogos]
      summary: Obras sociales (para el desplegable)
      responses:
        '200':
          description: Lista ordenada por nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  obrasSociales:
                    type: array
                    items: { $ref: '#/components/schemas/ItemCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }

  # ------------------------------------------------------------------
  # MÓDULOS
  # ------------------------------------------------------------------
  /modulos:
    get:
      tags: [Módulos]
      summary: Listar módulos del sistema
      responses:
        '200':
          description: Lista ordenada por nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  modulos:
                    type: array
                    items: { $ref: '#/components/schemas/ItemCatalogo' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
    post:
      tags: [Módulos]
      summary: Crear módulo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuloNombre' }
      responses:
        '201':
          description: Módulo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaModulo' }
        '400':
          description: '`DATOS_INCOMPLETOS` o `NOMBRE_INVALIDO` (más de 40 caracteres)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '409':
          description: '`MODULO_DUPLICADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /modulos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      tags: [Módulos]
      summary: Renombrar módulo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModuloNombre' }
      responses:
        '200':
          description: Módulo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaModulo' }
        '400':
          description: '`ID_INVALIDO`, `DATOS_INCOMPLETOS` o `NOMBRE_INVALIDO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: '`MODULO_NO_ENCONTRADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`MODULO_DUPLICADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Módulos]
      summary: Borrar módulo
      description: Solo si no está asignado a ningún rol.
      responses:
        '204':
          description: Borrado (sin cuerpo)
        '400': { $ref: '#/components/responses/IdInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: '`MODULO_NO_ENCONTRADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`MODULO_EN_USO`: está asignado a un rol'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------
  # ROLES
  # ------------------------------------------------------------------
  /roles:
    get:
      tags: [Roles]
      summary: Listar roles con su cantidad de módulos
      responses:
        '200':
          description: Lista ordenada por nombre
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer, example: 1 }
                        nombre: { type: string, example: administrador }
                        cantidad_modulos: { type: integer, example: 6 }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }

  /roles/{id}/modulos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      tags: [Roles]
      summary: Módulos a los que accede el rol
      responses:
        '200':
          description: Módulos del rol
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaModulosRol' }
        '400': { $ref: '#/components/responses/IdInvalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: '`ROL_NO_ENCONTRADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Roles]
      summary: Reemplazar los módulos del rol
      description: La lista que se manda reemplaza entera a la anterior. Vacía le saca todos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modulos]
              properties:
                modulos:
                  type: array
                  items: { type: integer }
                  example: [1, 3]
      responses:
        '200':
          description: Módulos actualizados
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RespuestaModulosRol' }
        '400':
          description: '`ID_INVALIDO`, `DATOS_INCOMPLETOS` o `MODULO_INEXISTENTE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
        '404':
          description: '`ROL_NO_ENCONTRADO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ------------------------------------------------------------------
  # EJEMPLO
  # ------------------------------------------------------------------
  /ejemplo/publico:
    get:
      tags: [Ejemplo]
      summary: Ruta abierta
      security: []
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
  /ejemplo/protegido:
    get:
      tags: [Ejemplo]
      summary: Ruta que exige token
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /ejemplo/solo-admin:
    get:
      tags: [Ejemplo]
      summary: Ruta solo para el rol administrador
      responses:
        '200': { $ref: '#/components/responses/Mensaje' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '403': { $ref: '#/components/responses/SinPermiso' }
  /ejemplo/error:
    get:
      tags: [Ejemplo]
      summary: Falla a propósito (para ver el formato de error)
      security: []
      responses:
        '500':
          description: '`ERROR_INTERNO`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    token:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: El token que devuelve el login. Dura 2 horas.

  parameters:
    IdInterno:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 1 }
    IdCuota:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, example: 12 }

  responses:
    SolicitudInvalida:
      description: Faltan datos o el JSON está mal armado (`DATOS_INCOMPLETOS`, `JSON_INVALIDO`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    IdInvalido:
      description: '`ID_INVALIDO`: el id no es un entero mayor a cero'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAutenticado:
      description: '`TOKEN_FALTANTE`, `TOKEN_INVALIDO` o `TOKEN_VENCIDO` (hay que volver a loguearse)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SinPermiso:
      description: '`SIN_PERMISO` (el rol no alcanza) o `MODULO_SIN_ACCESO` (el rol no tiene el módulo)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternoNoEncontrado:
      description: '`INTERNO_NO_ENCONTRADO`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    DniDuplicado:
      description: '`DNI_DUPLICADO`: ya hay un interno activo con ese DNI'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Mensaje:
      description: Respuesta con un mensaje
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, example: true }
              mensaje: { type: string }

  schemas:
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            codigo: { type: string, example: TOKEN_FALTANTE }
            mensaje: { type: string, example: Falta el token de acceso }

    UsuarioSesion:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombreUsuario: { type: string, example: admin }
        rol: { type: string, example: administrador }
        modulos:
          type: array
          description: Nombres de los módulos del rol, para armar el menú
          items: { type: string }
          example: [internos, cobranzas, reportes]

    ItemCatalogo:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nombre: { type: string, example: activo }

    ModuloNombre:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 40, example: reportes }

    RespuestaModulo:
      type: object
      properties:
        ok: { type: boolean, example: true }
        modulo: { $ref: '#/components/schemas/ItemCatalogo' }

    RespuestaModulosRol:
      type: object
      properties:
        ok: { type: boolean, example: true }
        rol: { type: string, example: operador }
        modulos:
          type: array
          items: { $ref: '#/components/schemas/ItemCatalogo' }

    Contacto:
      type: object
      description: Necesita nombre y al menos un teléfono o un email.
      required: [nombre]
      properties:
        nombre: { type: string, example: Maria Perez }
        parentesco: { type: string, nullable: true, example: madre }
        telefono: { type: string, nullable: true, example: '1155556666' }
        email: { type: string, format: email, nullable: true, example: null }

    ContactoGuardado:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
        - $ref: '#/components/schemas/Contacto'

    Legajo:
      type: object
      properties:
        id: { type: integer, example: 1 }
        numero: { type: string, example: LEG-20261002-0001 }
        fecha_apertura: { type: string, example: '2026-10-02 23:15:02' }

    InternoAlta:
      type: object
      required: [dni, apellido, nombre, contactos]
      properties:
        dni: { type: string, pattern: '^\d{7,8}$', example: '30111222' }
        apellido: { type: string, example: Perez }
        nombre: { type: string, example: Juan }
        fecha_nacimiento: { type: string, format: date, nullable: true, example: '1990-05-12' }
        judicializado: { type: integer, enum: [0, 1], default: 0, example: 1 }
        datos_salud: { type: string, nullable: true, example: hipertenso }
        obra_social_id: { type: integer, nullable: true, example: 3 }
        fecha_ingreso:
          type: string
          format: date
          description: Opcional, si no viene es la fecha del día. No puede ser futura.
          example: '2026-09-22'
        contactos:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/Contacto' }

    InternoModificacion:
      type: object
      description: Todos los campos son opcionales, pero tiene que venir al menos uno.
      properties:
        dni: { type: string, pattern: '^\d{7,8}$', example: '30111222' }
        apellido: { type: string, example: Pérez }
        nombre: { type: string, example: Juan }
        fecha_nacimiento: { type: string, format: date, nullable: true, example: '1990-05-12' }
        judicializado: { type: integer, enum: [0, 1], example: 0 }
        datos_salud: { type: string, nullable: true, example: hipertenso }
        obra_social_id: { type: integer, nullable: true, example: 2 }
        contactos:
          type: array
          minItems: 2
          description: Si viene, reemplaza a todos los contactos anteriores.
          items: { $ref: '#/components/schemas/Contacto' }
        fecha_ingreso:
          type: string
          format: date
          description: No se modifica. Solo se acepta con el mismo valor que ya tiene.
        legajo:
          type: string
          description: No se modifica. Solo se acepta si es uno de los legajos del interno.

    InternoBaja:
      type: object
      required: [motivo, fecha_egreso]
      properties:
        motivo:
          type: string
          maxLength: 500
          description: Por qué egresa. Queda guardado en el historial de estados.
          example: Alta médica
        fecha_egreso:
          type: string
          format: date
          description: No puede ser futura ni anterior a la fecha de ingreso del interno.
          example: '2026-10-03'

    ParametrosNuevos:
      type: object
      required: [valor_cuota, dia_vencimiento]
      properties:
        valor_cuota: { type: number, format: float, minimum: 0, example: 18000 }
        valor_mora:
          type: number
          format: float
          minimum: 0
          default: 0
          description: Interés por pago fuera de término.
          example: 800
        dia_vencimiento: { type: integer, minimum: 1, maximum: 31, example: 15 }
        observaciones: { type: string, maxLength: 500, nullable: true, example: Aumento de noviembre }

    ConfiguracionCuota:
      type: object
      properties:
        id: { type: integer, example: 2 }
        valor_cuota: { type: number, format: float, example: 18000 }
        valor_mora: { type: number, format: float, example: 800 }
        dia_vencimiento: { type: integer, example: 15 }
        es_actual: { type: integer, enum: [0, 1], example: 1 }
        observaciones: { type: string, nullable: true, example: Aumento de noviembre }
        creado_en:
          type: string
          description: Desde cuándo rige esta configuración.
          example: '2026-10-16 17:33:12'
        definido_por: { type: string, nullable: true, example: Administrador de prueba }

    PeriodoCuotas:
      type: object
      required: [anio, mes]
      properties:
        anio: { type: integer, minimum: 2020, maximum: 2100, example: 2026 }
        mes: { type: integer, minimum: 1, maximum: 12, example: 11 }

    ResultadoGeneracion:
      type: object
      properties:
        ok: { type: boolean, example: true }
        periodo:
          type: object
          properties:
            anio: { type: integer, example: 2026 }
            mes: { type: integer, example: 11 }
        valor_cuota: { type: number, format: float, example: 18000 }
        fecha_vencimiento: { type: string, format: date, example: '2026-11-30' }
        internos_activos: { type: integer, example: 3 }
        creadas: { type: integer, example: 2 }
        omitidas: { type: integer, description: Ya tenían la cuota del período, example: 1 }

    ResultadoMora:
      type: object
      properties:
        ok: { type: boolean, example: true }
        aplicadas: { type: integer, description: Cuotas que entraron en mora en esta corrida, example: 1 }
        interes_total: { type: number, format: float, example: 800 }
        cuotas:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, example: 12 }
              interno_id: { type: integer, example: 1 }
              periodo: { type: string, description: AAAA-MM, example: 2026-10 }
              interes_aplicado: { type: number, format: float, example: 800 }

    PagoNuevo:
      type: object
      required: [medio_pago_id, monto]
      properties:
        medio_pago_id: { type: integer, description: 'Del catálogo medios_pago', example: 1 }
        monto:
          type: number
          format: float
          description: Mayor a cero y como máximo el saldo pendiente de la cuota.
          example: 9000
        fecha_pago:
          type: string
          format: date
          description: Por defecto hoy. No puede ser futura.
          example: '2026-10-20'
        numero_comprobante: { type: string, maxLength: 50, nullable: true, example: 0001-00012345 }
        observaciones: { type: string, maxLength: 500, nullable: true, example: pago parcial }
        obra_social_id:
          type: integer
          description: Obligatorio solo si el medio de pago es obra social.
          example: 2

    Cuota:
      type: object
      properties:
        id: { type: integer, example: 12 }
        interno_id: { type: integer, example: 1 }
        periodo: { type: string, description: AAAA-MM, example: 2026-10 }
        valor_base: { type: number, format: float, example: 18000 }
        interes_aplicado: { type: number, format: float, example: 0 }
        total: { type: number, format: float, example: 18000 }
        saldo_pendiente: { type: number, format: float, example: 9000 }
        estado: { type: string, enum: [pendiente, pagada, parcial, vencida, anulada], example: parcial }
        fecha_vencimiento: { type: string, format: date, example: '2026-10-10' }

    Pago:
      type: object
      properties:
        id: { type: integer, example: 3 }
        monto: { type: number, format: float, example: 9000 }
        fecha_pago: { type: string, example: '2026-10-20 14:05:11' }
        medio_pago: { type: string, example: efectivo }
        numero_comprobante: { type: string, nullable: true, example: 0001-00012345 }
        observaciones: { type: string, nullable: true, example: pago parcial }
        registrado_por: { type: string, nullable: true, description: Nombre de quien registró el pago, example: Administrador de prueba }

    EgresoNuevo:
      type: object
      required: [concepto, categoria, monto, medio_pago_id]
      properties:
        concepto: { type: string, maxLength: 200, example: Factura de luz }
        categoria: { type: string, maxLength: 60, description: Se guarda en minúsculas, example: servicios }
        monto: { type: number, format: float, minimum: 0, example: 45000.5 }
        medio_pago_id: { type: integer, description: 'Del catálogo /medios-pago', example: 2 }
        fecha:
          type: string
          format: date
          description: Por defecto la del día. No puede ser futura.
          example: '2026-10-05'
        comprobante: { type: string, maxLength: 100, nullable: true, example: B-0001-00099 }
        observaciones: { type: string, maxLength: 500, nullable: true }

    Egreso:
      type: object
      properties:
        id: { type: integer, example: 1 }
        concepto: { type: string, example: Factura de luz }
        categoria: { type: string, example: servicios }
        monto: { type: number, format: float, example: 45000.5 }
        fecha: { type: string, example: '2026-10-05' }
        comprobante: { type: string, nullable: true, example: B-0001-00099 }
        observaciones: { type: string, nullable: true }
        medio_pago: { type: string, example: transferencia }
        registrado_por: { type: string, nullable: true, example: Administrador de prueba }

    ResumenEgresos:
      type: object
      description: Totales de todo el período, sin aplicar el filtro de categoría.
      properties:
        cantidad: { type: integer, example: 4 }
        total: { type: number, format: float, example: 385000.5 }
        por_categoria:
          type: array
          description: De mayor a menor gasto.
          items:
            type: object
            properties:
              categoria: { type: string, example: sueldos }
              cantidad: { type: integer, example: 1 }
              total: { type: number, format: float, example: 300000 }

    Paginacion:
      type: object
      properties:
        pagina: { type: integer, example: 1 }
        por_pagina: { type: integer, example: 20 }
        total: { type: integer, example: 135 }
        total_paginas: { type: integer, example: 7 }

    ResumenPeriodo:
      type: object
      description: Totales de todo el período, sin aplicar los filtros y sin contar las anuladas.
      properties:
        facturado: { type: number, format: float, example: 117800 }
        cobrado: { type: number, format: float, description: Facturado menos la suma de saldos, example: 96400 }
        pendiente: { type: number, format: float, description: Saldos de las que no vencieron, example: 14700 }
        vencido: { type: number, format: float, description: Saldos de las vencidas, example: 6700 }
        cuotas: { type: integer, example: 128 }
        cuotas_pendientes: { type: integer, description: Con saldo y sin vencer, example: 16 }
        internos_con_vencidas: { type: integer, example: 7 }

    UltimoPago:
      type: object
      nullable: true
      properties:
        fecha_pago: { type: string, example: '2026-10-20 14:05:11' }
        numero_comprobante: { type: string, nullable: true, example: '0001-00012345' }
        medio_pago: { type: string, example: efectivo }

    CuotaDelPeriodo:
      type: object
      properties:
        id: { type: integer, example: 12 }
        interno_id: { type: integer, example: 1 }
        periodo: { type: string, example: '2026-10' }
        valor_base: { type: number, format: float, example: 18000 }
        interes_aplicado: { type: number, format: float, example: 0 }
        total: { type: number, format: float, example: 18000 }
        saldo_pendiente: { type: number, format: float, example: 9000 }
        estado: { type: string, example: parcial }
        fecha_vencimiento: { type: string, format: date, example: '2026-10-10' }
        interno:
          type: object
          properties:
            id: { type: integer, example: 1 }
            dni: { type: string, example: '30111222' }
            apellido: { type: string, example: Pérez }
            nombre: { type: string, example: Juan }
            legajo: { type: string, nullable: true, description: El último legajo abierto, example: LEG-20261002-0001 }
        ultimo_pago: { $ref: '#/components/schemas/UltimoPago' }

    InternoPadron:
      type: object
      properties:
        id: { type: integer, example: 3 }
        dni: { type: string, example: '28999000' }
        apellido: { type: string, example: Núñez }
        nombre: { type: string, example: Ángel }
        legajo: { type: string, nullable: true, description: Último legajo abierto, example: LEG-20261002-0003 }
        estado: { type: string, example: activo }
        judicializado: { type: integer, enum: [0, 1], example: 0 }
        fecha_ingreso: { type: string, example: '2026-10-02' }
        tiene_deuda:
          type: boolean
          description: Saldo pendiente en alguna cuota vencida que no esté anulada
          example: false

    InternoFicha:
      type: object
      properties:
        id: { type: integer, example: 1 }
        dni: { type: string, example: '30111222' }
        apellido: { type: string, example: Pérez }
        nombre: { type: string, example: Juan }
        fecha_nacimiento: { type: string, nullable: true, example: '1990-05-12' }
        judicializado: { type: integer, enum: [0, 1], example: 1 }
        datos_salud: { type: string, nullable: true, example: hipertenso }
        fecha_ingreso: { type: string, example: '2026-10-02' }
        creado_por: { type: integer, nullable: true, example: 1 }
        creado_en: { type: string, example: '2026-10-02 23:15:02' }
        modificado_por: { type: integer, nullable: true, description: Usuario de la última modificación, example: 1 }
        modificado_en: { type: string, nullable: true, description: Fecha y hora de la última modificación, example: '2026-10-03 14:20:00' }
        estado: { type: string, example: activo }
        obra_social_id: { type: integer, nullable: true, example: 2 }
        obra_social: { type: string, nullable: true, example: PAMI }
        legajos:
          type: array
          items: { $ref: '#/components/schemas/Legajo' }
        contactos:
          type: array
          items: { $ref: '#/components/schemas/ContactoGuardado' }

    InternoFichaCompleta:
      allOf:
        - $ref: '#/components/schemas/InternoFicha'
        - type: object
          properties:
            historial:
              type: array
              description: Cambios de estado, del más viejo al más nuevo
              items:
                type: object
                properties:
                  id: { type: integer, example: 1 }
                  estado: { type: string, example: activo }
                  fecha: { type: string, example: '2026-10-02 23:15:02' }
                  motivo: { type: string, nullable: true, example: null }
                  usuario: { type: string, nullable: true, description: Nombre de quien hizo el cambio, example: Administrador de prueba }
